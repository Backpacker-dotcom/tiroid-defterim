name: APK oluştur

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Uygulama sayfasını APK içine kopyala
        run: cp web/index.html android/app/src/main/assets/index.html
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 gizli değişkeni yok. Depo ayarlarında Secrets and variables > Actions altına ekle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: APK derle
        working-directory: android
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: APK'yı adlandır
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FlutterThyro.apk
          cp FlutterThyro.apk TiroidDefterim.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FlutterThyro 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            FlutterThyro.apk
            TiroidDefterim.apk
          body: |
            Telefona kurmak için aşağıdaki FlutterThyro.apk dosyasını indir (TiroidDefterim.apk aynı dosyadır, eski bağlantılar için duruyor).
            Uygulama ekranları ve yiyecek listesi buradan otomatik güncellenir; yeniden kurman gerekmez.

            Önemli (bir kereye mahsus): Uygulamanın imza anahtarı güvenlik nedeniyle değişti. Eski sürümün üzerine kurulmazsa önce Ayarlar > Yedek > "Şimdi yedekle" ile yedek al, eski uygulamayı kaldır, bu APK'yı kur ve Ayarlar > Yedek > "Dosyadan geri yükle" ile yedeği geri yükle.

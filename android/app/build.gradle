plugins { id 'com.android.application' }

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.backpacker.tiroiddefterim'
    compileSdk 34
    defaultConfig {
        applicationId 'com.backpacker.tiroiddefterim'
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }
    // İmza anahtarı depoda tutulmaz; GitHub Actions onu gizli değişkenlerden (Secrets) oluşturur.
    // Anahtar verilmezse (yerel derleme) APK hata ayıklama anahtarıyla imzalanır.
    def ksPath = System.getenv("SIGNING_KEYSTORE")
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}

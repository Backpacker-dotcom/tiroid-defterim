<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Tiroid Defterim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2B6A5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: tek ekranlı mobil uygulama — üstte günün özeti, altta sabit sekme çubuğu */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E6ECE8; --ink:#17231F; --muted:#5C6C66; --line:#D5DED9;
  --accent:#2B6A5E; --accent-ink:#FFFFFF; --accent-soft:#D9EAE4;
  --good:#2F7D4A; --good-soft:#DCEFE2; --warn:#A86A06; --warn-soft:#F7EACD; --bad:#B23A31; --bad-soft:#F6DDDA;
  --prot:#3D6BB3; --fat:#C07A12; --carb:#7A5BB5;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --sunk:#111A17; --ink:#E5EEEA; --muted:#93A59F; --line:#2A3833;
  --accent:#5FB3A2; --accent-ink:#0B1412; --accent-soft:#1E3631;
  --good:#6CC28A; --good-soft:#1C3324; --warn:#E3B04F; --warn-soft:#3A2E14; --bad:#EE7F75; --bad-soft:#3D1E1B;
  --prot:#7FA6E8; --fat:#E3A447; --carb:#AE93E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --sunk:#111A17; --ink:#E5EEEA; --muted:#93A59F; --line:#2A3833;
  --accent:#5FB3A2; --accent-ink:#0B1412; --accent-soft:#1E3631;
  --good:#6CC28A; --good-soft:#1C3324; --warn:#E3B04F; --warn-soft:#3A2E14; --bad:#EE7F75; --bad-soft:#3D1E1B;
  --prot:#7FA6E8; --fat:#E3A447; --carb:#AE93E6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
header.top h1{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
header.top .date{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.logo{width:30px;height:30px;flex:none}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Kalori halkası */
.ring-row{display:flex;gap:16px;align-items:center}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.ring .sub{font-size:12px;color:var(--muted);margin-top:4px}
.ring-meta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.carry{font-size:12.5px;border-radius:8px;padding:6px 8px;background:var(--warn-soft);color:var(--warn)}

/* Makrolar */
.macros{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.macro .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.macro .head span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.left{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.left.over{color:var(--bad);font-weight:700}
.left.ok{color:var(--muted)}

/* İlaç */
.med{display:flex;align-items:center;gap:12px}
.med .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.med .txt{flex:1;min-width:0}
.med.done .ico{background:var(--good-soft);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.notice{font-size:13px;border-radius:10px;padding:10px 12px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}

/* Öğün listesi */
.meal{display:flex;flex-direction:column;gap:2px}
.meal + .meal{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.entry .n{flex:1;min-width:0}
.entry .n small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.entry .k{font-variant-numeric:tabular-nums;font-weight:700}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--sunk);color:var(--bad)}

.entry .tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.entry.st-no .nm{color:var(--bad);font-weight:700}
.entry.st-no .tag{background:var(--bad-soft);color:var(--bad)}
.entry.st-care .tag{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:var(--r);padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-size:14px;border:1px solid var(--bad)}
.alert b{display:block;margin-bottom:2px}
.plan{display:flex;flex-direction:column;gap:0;margin-top:10px}
.step{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .t{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.step .w{font-size:14px;min-width:0}
.step .w small{display:block;color:var(--muted);font-size:12.5px}
.step .s{font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px;white-space:nowrap}
.step .s.done{background:var(--good-soft);color:var(--good)}
.step .s.wait{background:var(--warn-soft);color:var(--warn)}
.step .s.next{background:var(--sunk);color:var(--muted)}
/* Arama */
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px 13px 42px;font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.results{display:flex;flex-direction:column;gap:8px}
.food{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.food::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.food .body{flex:1;min-width:0}
.food .name{font-weight:700}
.food .why{font-size:13px;color:var(--muted);margin-top:2px}
.food .nut{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.st-ok{--st:var(--good)} .st-ok .pill{background:var(--good-soft);color:var(--good)}
.st-care{--st:var(--warn)} .st-care .pill{background:var(--warn-soft);color:var(--warn)}
.st-no{--st:var(--bad)} .st-no .pill{background:var(--bad-soft);color:var(--bad)}
.add{border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:10px;font-size:22px;font-weight:700;flex:none}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.preview div{background:var(--bg);border-radius:10px;padding:8px 4px}
.preview b{display:block;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.preview span{font-size:11px;color:var(--muted)}

/* Geçmiş */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:9px;border:0;background:var(--sunk);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .d.ok{background:var(--good-soft);color:var(--good)}
.cal .d.over{background:var(--bad-soft);color:var(--bad)}
.cal .d.under{background:var(--warn-soft);color:var(--warn)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d.sel{background:var(--ink);color:var(--bg)}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.cal .d .dot.no{opacity:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}

/* Alt sekmeler */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.sync{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:all .4s ease}}
</style>

const LS="tiroid-defterim-v1";

let cloud=null;
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const col=db.collection("data/users/"+id);
    const snap=await col.get();
    if(snap.empty){
      cloud=col; $("#sync").textContent="Hesabına kaydediliyor";
      await col.doc("settings").set(JSON.parse(JSON.stringify(S.settings)));
      for(const k of Object.keys(S.days)) await col.doc("d_"+k).set(JSON.parse(JSON.stringify(S.days[k])));
    }else{
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;
        if(d.id==="settings")S.settings={...DEFAULTS,...v};
        else if(d.id.startsWith("d_"))S.days[d.id.slice(2)]=JSON.parse(JSON.stringify(v));});
      cloud=col; lsSave();
    }
    $("#sync").textContent="Hesabına kaydediliyor";
    render();
  }catch(e){$("#sync").textContent="Bu cihazda kayıtlı"}
}
function saveSettings(){lsSave();if(cloud)cloud.doc("settings").set(JSON.parse(JSON.stringify(S.settings))).catch(()=>{})}
function saveDay(k){lsSave();if(cloud&&S.days[k])cloud.doc("d_"+k).set(JSON.parse(JSON.stringify(S.days[k]))).catch(()=>{})}
function day(k){if(!S.days[k])S.days[k]={entries:[],med:null};return S.days[k]}

/* ---------- Hesaplar ---------- */
function totals(d){const t={k:0,p:0,f:0,c:0};(d&&d.entries||[]).forEach(e=>{t.k+=e.k;t.p+=e.p;t.f+=e.f;t.c+=e.c});return t}
function prevKey(k){const d=parseKey(k);d.setDate(d.getDate()-1);return keyOf(d)}
// Dünkü aşım bugünün hedefinden düşülür (en fazla ayarlanan yüzde kadar)
function targetFor(k){
  const st=S.settings, base=+st.kcal||1800;
  let carry=0;
  if(st.carry){const y=S.days[prevKey(k)];
    if(y&&y.entries&&y.entries.length){const yt=totals(y).k, ytar=y.target||base; if(yt>ytar)carry=Math.min(yt-ytar,base*(st.carryMax/100));}}
  const kcal=Math.round(base-carry);
  return{base,carry:Math.round(carry),kcal,p:kcal*st.pPct/100/4,f:kcal*st.fPct/100/9,c:kcal*st.cPct/100/4};
}

function stOf(e){if(e.d)return e.d;const f=allFoods().find(x=>x.n===e.n);return f?f.d:"ok"}
function lagOf(f){const w=f.why||"";return /4 saat/.test(w)?240:/30-60 dk/.test(w)?60:30}
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const toHM=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function medBase(k){const d=S.days[k];return d&&d.med?toMin(d.med.at):toMin(S.settings.medTime)}
function vPlan(k){
  const d=day(k),base=medBase(k),now=nowMin(),taken=!!d.med;
  const rows=[
    [base,"İlaç","Aç karnına, sadece bir bardak suyla",0],
    [base+30,"Kahvaltı","En erken bu saatte; 60 dk beklemek daha iyi",30],
    [base+60,"Çay ve kahve","Kahve emilimi en çok etkileyen içecek",60],
    [base+240,"Süt, yoğurt, peynir, soya","Ayrıca keten tohumu, kalsiyum ve demir takviyesi",240]];
  return `<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>Bugünün ilaç düzeni</h2><span class="small muted">${taken?"ilacı aldığın saate göre":"plan saatine göre"}</span></div>
  <div class="plan">${rows.map(([t,w,sm,off],i)=>{let st;
    if(i===0)st=taken?`<span class="s done">Alındı</span>`:now>t?`<span class="s wait">Alınmadı</span>`:`<span class="s next">Bekliyor</span>`;
    else st=!taken?`<span class="s next">İlaçtan sonra</span>`:now>=t?`<span class="s done">Serbest</span>`:`<span class="s wait">${t-now} dk kaldı</span>`;
    return `<div class="step"><span class="t">${i===0?"":"≥ "}${toHM(t)}</span><span class="w"><b>${w}</b><small>${sm}</small></span>${st}</div>`}).join("")}</div></section>`;
}
/* ---------- Ekranlar ---------- */
function ring(pct,over){
  const R=56,C=2*Math.PI*R,v=Math.min(pct,1);
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
  <circle cx="66" cy="66" r="${R}" fill="none" stroke="${over?"var(--bad)":"var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v)}"/></svg>`;
}
function macro(name,col,got,tar,unit){
  const left=tar-got, over=left<0, pct=tar?Math.min(got/tar,1)*100:0;
  return `<div class="macro"><div class="head"><span><b>${name}</b></span><span>${r0(got)} / ${r0(tar)} ${unit}</span></div>
  <div class="bar"><i style="width:${pct}%;background:${over?"var(--bad)":col}"></i></div>
  <div class="left ${over?"over":"ok"}">${over?`${r0(-left)} ${unit} aştın`:`${r0(left)} ${unit} daha alabilirsin`}</div></div>`;
}
function vToday(){
  const k=todayKey(), d=day(k), T=targetFor(k), t=totals(d);
  if(!d.entries.length)d.target=T.kcal;
  const left=T.kcal-t.k, over=left<0;
  const med=d.med, st=S.settings;
  const now=new Date(), [mh,mm]=st.medTime.split(":").map(Number);
  const late=!med&&(now.getHours()*60+now.getMinutes())>(mh*60+mm+60);
  let html=`<section class="card">
    <div class="ring-row"><div class="ring">${ring(t.k/T.kcal,over)}<div class="c">
      <div class="big num" style="color:${over?"var(--bad)":"var(--ink)"}">${r0(Math.abs(left))}</div>
      <div class="sub">${over?"kcal aştın":"kcal kaldı"}</div></div></div>
    <div class="ring-meta">
      <div class="kv"><span class="muted">Hedef</span><b>${T.kcal} kcal</b></div>
      <div class="kv"><span class="muted">Yediğin</span><b>${r0(t.k)} kcal</b></div>
      ${T.carry?`<div class="carry">Dünkü ${T.carry} kcal aşım bugünden düşüldü</div>`:""}
    </div></div>
    <div class="macros" style="margin-top:16px">
      ${macro("Protein","var(--prot)",t.p,T.p,"g")}
      ${macro("Yağ","var(--fat)",t.f,T.f,"g")}
      ${macro("Karbonhidrat","var(--carb)",t.c,T.c,"g")}
    </div>
    ${over?`<div class="notice warn" style="margin-top:14px">Bugün ${r0(-left)} kcal fazladasın. ${st.carry?`Yarınki hedefin ${Math.round(T.base-Math.min(-left,T.base*st.carryMax/100))} kcal olacak.`:""}</div>`:""}
  </section>
  ${(()=>{const bad=d.entries.filter(e=>stOf(e)==="no");return bad.length?`<div class="alert" role="alert"><b>Bugün uzak durman gereken ${bad.length} şey yedin</b>${[...new Set(bad.map(e=>esc(e.n)))].join(", ")}</div>`:""})()}
  <section class="card med ${med?"done":""}">
    <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="m9.5 8.5 5 7"/></svg></div>
    <div class="txt"><b>${esc(st.medName)}</b><div class="small ${late?"":"muted"}" style="${late?"color:var(--bad);font-weight:700":""}">${med?`${med.at} saatinde aldın`:late?`Saat ${st.medTime} geçti, henüz almadın`:`Her sabah ${st.medTime} · aç karnına`}</div></div>
    ${med?`<button class="btn sm ghost" id="medUndo">Geri al</button>`:`<button class="btn primary" id="medTake">Aldım</button>`}
  </section>
  ${vPlan(k)}
  <section class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><h2>Bugün yediklerin</h2><button class="btn sm primary" id="goSearch">+ Ekle</button></div>`;
  if(!d.entries.length) html+=`<div class="empty">Henüz bir şey eklemedin.<br>“Ara” sekmesinden yiyecek bulup ekleyebilirsin.</div>`;

function vHistory(){

    if(D&&D.entries&&D.entries.length){const t=totals(D).k,tar=D.target||targetFor(k).kcal;logged++;sum+=t;
      if(t>tar*1.05){cls="over";overSum+=t-tar}else if(t<tar*.8)cls="under";else{cls="ok";okDays++}

    ${pts.length>1?chart(pts,dim):""}</section>`;
  if(selDay&&S.days[selDay]){const D=S.days[selDay],t=totals(D),tar=D.target||targetFor(selDay).kcal;
    html+=`<section class="card"><h2>${fmtDate(parseKey(selDay))}</h2><p class="small muted" style="margin:4px 0 10px">${r0(t.k)} / ${tar} kcal · P ${r0(t.p)} g · Y ${r0(t.f)} g · K ${r0(t.c)} g · İlaç: ${D.med?D.med.at:"alınmadı"}</p>`+
    (D.entries||[]).map(e=>{const sd=stOf(e);return `<div class="entry ${ST[sd][0]}"><div class="n"><span class="nm">${esc(e.n)}</span>${sd!=="ok"?`<span class="tag">${ST[sd][1]}</span>`:""}<small>${e.g} g</small></div><span class="k">${r0(e.k)}</span></div>`}).join("")+`</section>`;}
  else if(selDay)html+=`<section class="card"><h2>${fmtDate(parseKey(selDay))}</h2><p class="small muted" style="margin:6px 0 0">Bu gün için kayıt yok.</p></section>`;
  return html;
}
function chart(pts,dim){
  const W=520,H=150,L=34,Rr=8,Tt=10,B=22,max=Math.max(...pts.map(p=>Math.max(p[1],p[2])))*1.1;
  const x=d=>L+(d-1)/(dim-1)*(W-L-Rr), y=v=>Tt+(1-v/max)*(H-Tt-B);
  const step=max>2500?1000:500, ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const line=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const tline=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[2]).toFixed(1)).join("");
  return `<div style="margin-top:14px"><span class="label">Günlük kalori</span><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ay boyunca günlük kalori grafiği">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
  <path d="${tline}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="${p[1]>p[2]*1.05?"var(--bad)":"var(--accent)"}"/>`).join("")}
  ${[1,10,20,dim].map(d=>`<text x="${x(d)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`).join("")}
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>Yediğin</span><span><i style="background:var(--muted)"></i>Hedef (kesikli)</span></div></div>`;
}

     `<div style="grid-column:1/-1;background:transparent;font-size:13px;color:${after<0?"var(--bad)":"var(--muted)"};font-weight:${after<0?700:400}">${after<0?`Eklersen bugün ${r0(-after)} kcal aşacaksın`:`Ekledikten sonra ${r0(after)} kcal kalacak`}</div>`};

    st.carry=$("#sCarry").checked;st.medName=$("#sMed").value.trim()||"İlacım";st.medTime=$("#sMedT").value||"07:00";
    const d=day(k);if(!d.entries.length)d.target=targetFor(k).kcal;
    saveSettings();pushReminder();toast(st.pPct+st.fPct+st.cPct===100?"Ayarlar kaydedildi":"Kaydedildi; yüzdelerin toplamı 100 değil");render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".scrim").forEach(x=>x.remove())});

lsLoad();
function pushReminder(){try{if(window.Android&&Android.setReminder)Android.setReminder(S.settings.medTime,S.settings.medName)}catch(e){}}
function syncNative(){try{if(!window.Android||!Android.takenFromNotification)return;const v=Android.takenFromNotification();
  if(v){const[dk,at]=v.split("|");if(dk&&at){day(dk).med={at};saveDay(dk);render()}}}catch(e){}}
window.onNativeResume=()=>{syncNative();render()};
pushReminder();
try{const t=localStorage.getItem(LS+"-tab");if(t)tab=t}catch(e){}
render();
syncNative();
initCloud();
setInterval(()=>{if(tab==="today"&&!document.querySelector(".scrim"))render()},60000);
</script>

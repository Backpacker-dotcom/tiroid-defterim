<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>FlutterThyro</title>
<!-- Tiroid Defterim -->
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#23584E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek ekranlı mobil uygulama — üstte günün özeti, altta sabit sekme çubuğu */
:root{
  --bg:#F4F7F5; --surface:#FFFFFF; --sunk:#E8EFEB; --ink:#13221E; --muted:#556B64; --line:#D1DED8;
  --accent:#23584E; --accent-ink:#FFFFFF; --accent-soft:#D5ECE4;
  --good:#247545; --good-soft:#DCF3E4; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --prot:#2563EB; --fat:#D97706; --carb:#7C3AED;
  --shadow-sm:0 1px 2px rgba(19,34,30,.05),0 1px 3px rgba(19,34,30,.04); --shadow:0 6px 16px -4px rgba(19,34,30,.12);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141F1C; --sunk:#0E1715; --ink:#E6F1ED; --muted:#8AA099; --line:#22332E;
  --accent:#4EB39D; --accent-ink:#061A15; --accent-soft:#14352D;
  --good:#4ADE80; --good-soft:#12331E; --warn:#FBBF24; --warn-soft:#382A0A; --bad:#F87171; --bad-soft:#3F1515;
  --prot:#60A5FA; --fat:#FBBF24; --carb:#A78BFA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 8px 20px -6px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141F1C; --sunk:#0E1715; --ink:#E6F1ED; --muted:#8AA099; --line:#22332E;
  --accent:#4EB39D; --accent-ink:#061A15; --accent-soft:#14352D;
  --good:#4ADE80; --good-soft:#12331E; --warn:#FBBF24; --warn-soft:#382A0A; --bad:#F87171; --bad-soft:#3F1515;
  --prot:#60A5FA; --fat:#FBBF24; --carb:#A78BFA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 8px 20px -6px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h2{letter-spacing:-.01em}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
header.top h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;color:var(--accent)}
header.top .date{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.logo{width:30px;height:30px;flex:none}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Kalori halkası */
.ring-row{display:flex;gap:16px;align-items:center}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.ring .sub{font-size:12px;color:var(--muted);margin-top:4px}
.ring-meta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.carry{font-size:12.5px;border-radius:8px;padding:6px 8px;background:var(--warn-soft);color:var(--warn)}

/* Makrolar */
.macros{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.macro .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.macro .head span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.wrow .btn{white-space:nowrap;padding-left:8px;padding-right:8px}
.left{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.left.over{color:var(--bad);font-weight:700}
.left.ok{color:var(--muted)}

/* İlaç */
.med{display:flex;align-items:center;gap:12px}
.med .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.med .txt{flex:1;min-width:0}
.med.done .ico{background:var(--good-soft);color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;transition:background .15s ease,transform .1s ease}
.btn:active{transform:scale(.98)}
.btn.primary{box-shadow:var(--shadow-sm)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.notice{font-size:13px;border-radius:10px;padding:10px 12px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}

/* Öğün listesi */
.meal{display:flex;flex-direction:column;gap:2px}
.meal + .meal{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.entry .n{flex:1;min-width:0}
.entry .n small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.entry .k{font-variant-numeric:tabular-nums;font-weight:700}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--sunk);color:var(--bad)}

.entry .tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.entry.st-no .nm{color:var(--bad);font-weight:700}
.entry.st-no .tag{background:var(--bad-soft);color:var(--bad)}
.entry.st-care .tag{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:var(--r);padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-size:14px;border:1px solid var(--bad)}
.alert b{display:block;margin-bottom:2px}
/* Arama */
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);padding:13px 14px 13px 42px;font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.results{display:flex;flex-direction:column;gap:8px}
.food{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.food::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.food .body{flex:1;min-width:0}
.food .name{font-weight:700}
.food .why{font-size:13px;color:var(--muted);margin-top:2px}
.food .nut{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.st-ok{--st:var(--good)} .st-ok .pill{background:var(--good-soft);color:var(--good)}
.st-care{--st:var(--warn)} .st-care .pill{background:var(--warn-soft);color:var(--warn)}
.st-no{--st:var(--bad)} .st-no .pill{background:var(--bad-soft);color:var(--bad)}
.add{border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:10px;font-size:22px;font-weight:700;flex:none}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.preview div{background:var(--bg);border-radius:10px;padding:8px 4px}
.preview b{display:block;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.preview span{font-size:11px;color:var(--muted)}

/* Geçmiş */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:9px;border:0;background:var(--sunk);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .d.ok{background:var(--good-soft);color:var(--good)}
.cal .d.over{background:var(--bad-soft);color:var(--bad)}
.cal .d.under{background:var(--warn-soft);color:var(--warn)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d.sel{background:var(--ink);color:var(--bg)}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.cal .d .dot.no{opacity:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}

/* Alt sekmeler */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs{box-shadow:0 -4px 16px -8px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.sync{font-size:11.5px;color:var(--muted)}
.daynav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow-sm)}
.daynav .mid{flex:1;text-align:center;min-width:0;position:relative}
.daynav .mid b{font-family:var(--f-display);font-size:15.5px;display:block}
.daynav .mid small{color:var(--muted);font-size:12px}
.daynav .mid input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.daynav .nb{width:40px;height:40px;border-radius:12px;border:0;background:var(--sunk);font-size:20px;font-weight:700;color:var(--ink)}
.daynav .nb:disabled{opacity:.35}
.pastnote{font-size:13px;border-radius:10px;padding:8px 12px;background:var(--warn-soft);color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}
.entry .n.eb{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.entry .n.eb:hover .nm{text-decoration:underline}
.entry .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.trow{display:flex;gap:10px;align-items:flex-end}.trow .field{flex:1;min-width:0}
.symrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.symrow>span{min-width:0}
.lv{display:flex;gap:4px;flex:none}
.lv button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.lv button[aria-pressed="true"]{color:#fff;border-color:transparent}
.lv button[data-lv="0"][aria-pressed="true"]{background:var(--good)}.lv button[data-lv="1"][aria-pressed="true"]{background:#7BA05B}
.lv button[data-lv="2"][aria-pressed="true"]{background:var(--warn)}.lv button[data-lv="3"][aria-pressed="true"]{background:#C2410C}.lv button[data-lv="4"][aria-pressed="true"]{background:var(--bad)}
.tag.lab-ok{background:var(--good-soft);color:var(--good)}.tag.lab-low,.tag.lab-high{background:var(--bad-soft);color:var(--bad)}
.rcp.lab .tag{margin-left:6px}
.qsec{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.qrow::-webkit-scrollbar{display:none}
.qf{flex:none;max-width:170px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--st,var(--good));background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow-sm)}
.qf .qn{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qf small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rp-nav{display:flex;align-items:center;gap:8px}
.rp-nav h2{flex:1;text-align:center;font-size:15.5px}
.summary{font-size:15px;line-height:1.6;margin:0}
.summary b{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted);display:block;line-height:1.3}
.tile.bad b{color:var(--bad)} .tile.good b{color:var(--good)} .tile.warn b{color:var(--warn)}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:8px}
.split i{display:block;height:100%}
.medstrip{display:grid;gap:6px;margin-top:10px}
.medstrip .m{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.medstrip .m i{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.m .taken{background:var(--good-soft);color:var(--good)} .m .missed{background:var(--bad-soft);color:var(--bad)}
.m .pending{background:var(--warn-soft);color:var(--warn)} .m .none,.m .future{background:var(--sunk);color:var(--muted)}
.rank{display:flex;flex-direction:column}
.rank div{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rank div:first-child{border-top:0}
.rank span:first-child{flex:1;min-width:0}
.rank span:last-child{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chartbox{overflow-x:auto;margin-top:8px}
.ing{display:grid;grid-template-columns:1fr 78px auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .n{min-width:0;font-size:14px}
.ing .n .nm{font-weight:600}
.ing input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:15px;text-align:right}
.ing .k{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.ing.st-no .nm{color:var(--bad)}
.ing .tag,.rcp .tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.ing.st-no .tag,.rcp.st-no .tag{background:var(--bad-soft);color:var(--bad)}
.ing.st-care .tag,.rcp.st-care .tag{background:var(--warn-soft);color:var(--warn)}
.rcp.st-ok .tag{background:var(--good-soft);color:var(--good)}
.drop{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.drop button{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:14px}
.drop button:first-child{border-top:0}
.drop button .dot{width:9px;height:9px;border-radius:50%;flex:none}
.drop button small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.rcp{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;position:relative;overflow:hidden}
.rcp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.rcp .b{flex:1;min-width:0}
.rcp .b b{font-size:15px}
.rcp .b small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.steps{white-space:pre-wrap;font-size:14.5px;line-height:1.55;margin:0}
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.onb .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));

/* ---------- Kayıt katmanı: önce bu cihaz, hesap bağlanınca bulut ---------- */
const LS="tiroid-defterim-v1";
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");if(v&&v.settings){S.settings={...DEFAULTS,...v.settings};S.days=v.days||{}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let cloud=null;
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const col=db.collection("data/users/"+id);
    const snap=await col.get();
    if(snap.empty){
      cloud=col; $("#sync").textContent="Hesabına kaydediliyor";
      await col.doc("settings").set(JSON.parse(JSON.stringify(S.settings)));
      for(const k of Object.keys(S.days)) await col.doc("d_"+k).set(JSON.parse(JSON.stringify(S.days[k])));
    }else{
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;
        if(d.id==="settings")S.settings={...DEFAULTS,...v};
        else if(d.id.startsWith("d_"))S.days[d.id.slice(2)]=JSON.parse(JSON.stringify(v));});
      cloud=col; lsSave();
    }
    $("#sync").textContent="Hesabına kaydediliyor";
    if(hasData()){const o=document.querySelector(".onb");if(o)o.remove();if(!S.settings.welcomed){S.settings.welcomed=true;saveSettings();pushReminder()}}
    render();
  }catch(e){$("#sync").textContent="Bu cihazda kayıtlı"}
}
function saveSettings(){lsSave();if(cloud)cloud.doc("settings").set(JSON.parse(JSON.stringify(S.settings))).catch(()=>{})}
function saveDay(k){lsSave();if(cloud&&S.days[k])cloud.doc("d_"+k).set(JSON.parse(JSON.stringify(S.days[k]))).catch(()=>{})}
function day(k){if(!S.days[k])S.days[k]={entries:[],med:null};return S.days[k]}

/* ---------- Hesaplar ---------- */
function totals(d){const t={k:0,p:0,f:0,c:0};(d&&d.entries||[]).forEach(e=>{t.k+=e.k;t.p+=e.p;t.f+=e.f;t.c+=e.c});return t}
function prevKey(k){const d=parseKey(k);d.setDate(d.getDate()-1);return keyOf(d)}
// Dünkü aşım bugünün hedefinden düşülür (en fazla ayarlanan yüzde kadar)
function targetFor(k){
  const st=S.settings, base=+st.kcal||1800;
  let carry=0;
  if(st.carry){const y=S.days[prevKey(k)];
    if(y&&y.entries&&y.entries.length){const yt=totals(y).k, ytar=y.target||base; if(yt>ytar)carry=Math.min(yt-ytar,base*(st.carryMax/100));}}
  const kcal=Math.round(base-carry);
  return{base,carry:Math.round(carry),kcal,p:kcal*st.pPct/100/4,f:kcal*st.fPct/100/9,c:kcal*st.cPct/100/4};
}

function stOf(e){if(e.d)return e.d;const f=allFoods().find(x=>x.n===e.n);return f?f.d:"ok"}
function lagOf(f){const w=f.why||"";return /4 saat/.test(w)?240:/30-60 dk/.test(w)?60:30}
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const toHM=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const noMed=()=>!!S.settings.noMed;
function medBase(k){const d=S.days[k];return d&&d.med?toMin(d.med.at):medMin()}
// Kullanıcının ayarladığı ilaç saati (dakika); ayarlanmadıysa null
const medMin=()=>S.settings.medTime?toMin(S.settings.medTime):null;

const fmtL=ml=>(Math.round(ml/100)/10).toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
function waterCard(k){const d=day(k),w=d.water||0,today=isToday(k),full=Math.floor(w/200);
  const ico=`<div class="ico" style="background:#E3F0FB;color:#2563EB"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div>`;

function defaultMeal(){const h=new Date().getHours();return h<5?"ara":h<11?"kahvalti":h<15?"ogle":h<18?"ara":h<22?"aksam":"ara"}
function openAdd(f){
  const k=curDay(),today=isToday(k);
  let g=f.por||100, meal=f.meal||(today?defaultMeal():"ogle"), tm=today?nowHM():MEALT[meal], tmTouched=false, mealTouched=!!f.meal;
  const fav=(S.settings.favs||[]).includes(f.n);
  const [cls,lab]=ST[f.d];
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(f.n)} ekle">
   <div class="${cls}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="font-size:18px">${esc(f.n)}</h2><span class="pill">${lab}</span>${f.recipe?"":`<button class="btn sm ghost" id="aFav" aria-pressed="${fav}" style="margin-left:auto;font-size:18px;padding:4px 10px;color:${fav?"var(--warn)":"var(--muted)"}" aria-label="Favorilere ekle">${fav?"★":"☆"}</button>`}</div>
   ${today?"":`<div class="pastnote"><span><b>${parseKey(k).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})}</b> gününe eklenecek</span></div>`}
   ${f.d!=="ok"?`<div class="notice ${f.d==="no"?"":"warn"}" style="${f.d==="no"?"background:var(--bad-soft);color:var(--bad);font-weight:700":""}">${esc(f.why)}</div>`:""}
   <div id="aLag"></div>
   <div class="field"><label for="aG">Miktar (gram)</label><input id="aG" type="number" inputmode="decimal" value="${g}"></div>
   <div class="chips">${f.por?`<button class="chip" data-g="${f.por}">${esc(f.pl)} (${f.por} g)</button><button class="chip" data-g="${f.por*2}">2 × (${f.por*2} g)</button>`:""}<button class="chip" data-g="100">100 g</button></div>
   <div class="seg" role="group" aria-label="Öğün">${MEALS.map(([m,l])=>`<button data-meal="${m}" aria-pressed="${m===meal}">${l}</button>`).join("")}</div>
   <div class="field"><label for="aT">Yeme saati</label><input id="aT" type="time" value="${tm}"></div>
   <div class="preview" id="aPrev"></div>
   <div class="row"><button class="btn ghost" id="aCancel">Vazgeç</button><button class="btn primary" id="aOk">Ekle</button></div></div>`;
  document.body.appendChild(sc);
  const lagChk=()=>{const D=S.days[k];const box=$("#aLag");if(!box)return;if(!D||!D.med||f.recipe&&!f.lag){box.innerHTML="";return}
    const free=toMin(D.med.at)+(f.lag||lagOf(f)),at=toMin($("#aT").value||tm);
    box.innerHTML=at>=toMin(D.med.at)&&at<free?`<div class="notice warn">İlacını ${D.med.at}'te aldın. Bunu yemek için ${toHM(free)}'e kadar beklemen önerilir${today&&at<=nowMin()+1?` (${free-nowMin()} dk kaldı)`:""}.</div>`:""};
  const upd=()=>{g=Math.max(0,+$("#aG").value||0);const m=g/100;
    const T=targetFor(k),t=totals(day(k)),after=T.kcal-t.k-f.k*m;
    $("#aPrev").innerHTML=`<div><b>${r0(f.k*m)}</b><span>kcal</span></div><div><b>${r1(f.p*m)}</b><span>protein g</span></div><div><b>${r1(f.f*m)}</b><span>yağ g</span></div><div><b>${r1(f.c*m)}</b><span>karb. g</span></div>`+
     `<div style="grid-column:1/-1;background:transparent;font-size:13px;color:${after<0?"var(--bad)":"var(--muted)"};font-weight:${after<0?700:400}">${after<0?`Eklersen ${dayWord(k).toLocaleLowerCase("tr-TR")} ${r0(-after)} kcal aşacaksın`:`Ekledikten sonra ${r0(after)} kcal kalacak`}</div>`};
  upd();lagChk();
  sc.addEventListener("input",e=>{if(e.target.id==="aG")upd();if(e.target.id==="aT"){tmTouched=true;lagChk();
    if(!mealTouched&&e.target.value){const h=toMin(e.target.value)/60;meal=h<11?"kahvalti":h<15.5?"ogle":h>=18&&h<22.5?"aksam":h<18?"ara":"ara";sc.querySelectorAll("[data-meal]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.meal===meal))}}});
  sc.addEventListener("click",e=>{const b=e.target.closest("button");
    if(e.target===sc||(b&&b.id==="aCancel")){sc.remove();return}
    if(!b)return;
    if(b.dataset.g){$("#aG").value=b.dataset.g;upd()}
    if(b.dataset.meal){meal=b.dataset.meal;mealTouched=true;sc.querySelectorAll("[data-meal]").forEach(x=>x.setAttribute("aria-pressed",x===b));if(!today&&!tmTouched){$("#aT").value=MEALT[meal];lagChk()}}
    if(b.id==="aFav"){const L=S.settings.favs||(S.settings.favs=[]);const i=L.indexOf(f.n);if(i>=0)L.splice(i,1);else L.unshift(f.n);saveSettings();const on=i<0;b.textContent=on?"★":"☆";b.style.color=on?"var(--warn)":"var(--muted)";toast(on?"Favorilere eklendi":"Favorilerden çıkarıldı");if(tab==="search")renderResults()}
    if(b.id==="aOk"&&g>0){const m=g/100,d=day(k);
      if(!d.entries.length)d.target=targetFor(k).kcal;
      d.entries.push({id:Date.now().toString(36),n:f.n,d:f.d,g:r0(g),k:f.k*m,p:f.p*m,f:f.f*m,c:f.c*m,meal,t:$("#aT").value||tm});
      saveDay(k);sc.remove();toast(`${f.n} ${today?"eklendi":dayWord(k)+" gününe eklendi"}`);render();}
  });
  setTimeout(()=>$("#aG")&&$("#aG").select(),50);
}
function openEdit(id){

  const base=e.g>0?{k:e.k/e.g,p:e.p/e.g,f:e.f/e.g,c:e.c/e.g}:{k:0,p:0,f:0,c:0};let meal=e.meal,g=e.g;

  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.n)} düzenle">
   <div class="${cls}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="font-size:18px">${esc(e.n)}</h2><span class="pill">${lab}</span></div>

   <div class="seg" role="group" aria-label="Öğün">${MEALS.map(([m,l])=>`<button data-meal="${m}" aria-pressed="${m===meal}">${l}</button>`).join("")}</div>

   <div class="row"><button class="btn ghost" id="eDel" style="color:var(--bad)">Sil</button><button class="btn ghost" id="eCancel">Vazgeç</button><button class="btn primary" id="eOk">Kaydet</button></div></div>`;
  document.body.appendChild(sc);
  const upd=()=>{g=Math.max(0,+$("#eG").value||0);$("#ePrev").innerHTML=`<div><b>${r0(base.k*g)}</b><span>kcal</span></div><div><b>${r1(base.p*g)}</b><span>protein g</span></div><div><b>${r1(base.f*g)}</b><span>yağ g</span></div><div><b>${r1(base.c*g)}</b><span>karb. g</span></div>`};upd();
  sc.addEventListener("input",ev=>{if(ev.target.id==="eG")upd()});
  sc.addEventListener("click",ev=>{const b=ev.target.closest("button");if(ev.target===sc||(b&&b.id==="eCancel")){sc.remove();return}if(!b)return;
    if(b.dataset.meal){meal=b.dataset.meal;sc.querySelectorAll("[data-meal]").forEach(x=>x.setAttribute("aria-pressed",x===b))}
    if(b.id==="eDel"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Emin misin?";return}d.entries=d.entries.filter(x=>x.id!==id);saveDay(k);sc.remove();toast("Silindi");render()}
    if(b.id==="eOk"&&g>0){Object.assign(e,{g:r0(g),k:base.k*g,p:base.p*g,f:base.f*g,c:base.c*g,meal,t:$("#eT").value||e.t});saveDay(k);sc.remove();toast("Güncellendi");render()}});
  setTimeout(()=>$("#eG")&&$("#eG").select(),50);
}

function barChart(cols,opt){

  const col={over:"var(--bad)",under:"var(--warn)",ok:"var(--good)",water:"#2563EB",none:"var(--line)"};
  let g="";for(let v=0;v<=max;v+=step)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  const bars=cols.map((c,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=c.v?ih*(c.v/max):0;
    return (c.v?`<rect x="${x.toFixed(1)}" y="${y(c.v).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col[c.cls]||"var(--accent)"}"><title>${c.title||""}</title></rect>`:"")+
      (c.label?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${c.label}</text>`:"")}).join("");
  const tl=cols.map((c,i)=>c.tar?`${i&&cols[i-1].tar?"L":"M"}${(L+i*bw).toFixed(1)} ${y(c.tar).toFixed(1)}H${(L+(i+1)*bw).toFixed(1)}`:"").join("");
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="${W>520?W:"100%"}" style="max-width:${W>520?"none":"100%"};display:block" role="img" aria-label="${opt&&opt.aria||"Grafik"}">${g}${bars}<path d="${tl.replace(/M/g," M").trim()}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/></svg></div>`}
function lineChart(cols,goal){
  const W=Math.max(320,cols.length*(cols.length>12?17:40)),H=160,L=40,Rr=10,T=12,B=24,iw=W-L-Rr,ih=H-T-B,bw=iw/cols.length;
  const vals=cols.filter(c=>c.v!=null).map(c=>c.v).concat(goal?[goal]:[]);if(!vals.length)return"";
  let lo=Math.floor(Math.min(...vals)-0.5),hi=Math.ceil(Math.max(...vals)+0.5);if(hi-lo<2){lo-=1;hi+=1}
  const step=hi-lo>12?5:hi-lo>6?2:1;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const y=v=>T+ih*(1-(v-lo)/(hi-lo)),x=i=>L+i*bw+bw/2;
  let g="";for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-5}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  const pts=cols.map((c,i)=>c.v!=null?[x(i),y(c.v),c]:null).filter(Boolean);
  const path=pts.map((p,j)=>(j?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const gl=goal?`<line x1="${L}" x2="${W-Rr}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${(y(goal)-4).toFixed(1)}" text-anchor="start" font-size="10" font-weight="700" fill="var(--good)">hedef ${fmtKg(goal)}</text>`:"";
  const area=pts.length>1?`<path d="${path}L${pts[pts.length-1][0].toFixed(1)} ${T+ih}L${pts[0][0].toFixed(1)} ${T+ih}Z" fill="var(--accent)" opacity=".10"/>`:"";
  const labels=cols.map((c,i)=>c.label?`<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${c.label}</text>`:"").join("");
  const dots=pts.map((p,j)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${j===pts.length-1?4.5:3}" fill="${j===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"><title>${p[2].title||""}</title></circle>`).join("");

function weightCard(A,cols){

function stackChart(cols){
  const W=Math.max(320,cols.length*(cols.length>12?17:40)),H=130,L=36,Rr=6,T=8,B=24,iw=W-L-Rr,ih=H-T-B,bw=iw/cols.length,y=v=>T+ih*(1-v/100);
  let g="";[0,50,100].forEach(v=>g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">%${v}</text>`);
  const bars=cols.map((c,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,tot=c.q.ok+c.q.care+c.q.no;let acc=0,r="";
    if(tot)[["ok","var(--good)"],["care","var(--warn)"],["no","var(--bad)"]].forEach(([k,clr])=>{const p=c.q[k]/tot*100;if(p>0){r+=`<rect x="${x.toFixed(1)}" y="${y(acc+p).toFixed(1)}" width="${w.toFixed(1)}" height="${(ih*p/100).toFixed(1)}" fill="${clr}"/>`;acc+=p}});

  if(t.id==="dPick"&&t.value){vDay=t.value>todayKey()?todayKey():t.value;wEdit=medEdit=false;render()}});

  else if(b.id==="doseAdd"){openDoseAdd()}
  else if(b.dataset.dedit){openDoseAdd(b.dataset.dedit)}
  else if(b.dataset.ddel){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Sil?";b.style.width="auto";return}S.settings.doses=dosesL().filter(x=>x.id!==b.dataset.ddel);saveSettings();render()}
  else if(b.id==="medTake"){day(k).med={at:nowHM()};medEdit=false;saveDay(k);toast("İlaç işaretlendi");render()}
  else if(b.id==="medEditB"){medEdit=true;render();setTimeout(()=>$("#medAt")&&$("#medAt").focus(),30)}
  else if(b.id==="medCancel"){medEdit=false;render()}
  else if(b.id==="medSaveT"){const v=$("#medAt").value;if(!/^\d{2}:\d{2}$/.test(v)){toast("Saati seç");return}day(k).med={at:v};medEdit=false;saveDay(k);toast("İlaç "+v+" olarak kaydedildi");render()}
  else if(b.id==="wSave"){const v=parseFloat(($("#wIn").value||"").replace(",","."));
    if(!(v>=30&&v<=300)){$("#wErr").textContent="Kiloyu kg olarak yaz, örneğin 72,5.";return}
    const pv=prevWeight(k);day(k).w=Math.round(v*10)/10;wEdit=false;saveDay(k);toast(pv?`${fmtKg(v)} kg kaydedildi (${fmtDiff(v-pv.w)} kg)`:`${fmtKg(v)} kg kaydedildi`);render()}
  else if(b.id==="wEditB"){wEdit=true;render();setTimeout(()=>{const i=$("#wIn");if(i){i.focus();i.select()}},30)}
  else if(b.id==="medUndo"){day(k).med=null;medEdit=false;saveDay(k);render()}
  else if(b.id==="goSearch"){tab="search";render();setTimeout(()=>$("#q")&&$("#q").focus(),30)}
  else if(b.dataset.del){const d=day(k);const ex=d.entries.find(x=>x.id===b.dataset.del);d.entries=d.entries.filter(x=>x.id!==b.dataset.del);saveDay(k);render();if(ex)toast(ex.n+" silindi")}
  else if(b.dataset.cat){cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderResults()}

  else if(b.dataset.rmeal){draft.meal=b.dataset.rmeal;document.querySelectorAll("[data-rmeal]").forEach(x=>x.setAttribute("aria-pressed",x===b))}
  else if(b.dataset.radd){const f=allFoods()[+b.dataset.radd];draft.items.push({n:f.n,g:f.por||100,k:f.k,p:f.p,f:f.f,c:f.c,d:f.d});rq="";$("#ri").value="";rDrop();updDraft();
    const ins=document.querySelectorAll("[data-ig]");const last=ins[ins.length-1];if(last){last.focus();last.select()}}
  else if(b.dataset.irm!==undefined){draft.items.splice(+b.dataset.irm,1);updDraft()}
  else if(b.id==="rCancel"){const id=draft.id;draft=null;openRecipe=recipes().some(r=>r.id===id)?id:null;render()}

    draft.items=draft.items.filter(i=>i.g>0);
    const L=recipes(),ix=L.findIndex(r=>r.id===draft.id);if(ix>=0)L[ix]=draft;else L.unshift(draft);

  else if(b.dataset.rid){openRecipe=b.dataset.rid;render();window.scrollTo(0,0)}
  else if(b.id==="rBack"){openRecipe=null;render()}
  else if(b.id==="rEdit"){newDraft(recipes().find(r=>r.id===openRecipe));render()}
  else if(b.id==="rDel"){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Emin misin? Sil";return}
    S.settings.recipes=recipes().filter(r=>r.id!==openRecipe);openRecipe=null;saveSettings();toast("Yemek silindi");render()}
  else if(b.id==="rToday"){openRecipeAdd(recipes().find(r=>r.id===openRecipe))}
  else if(b.id==="mPrev"){histMonth=new Date(histMonth.getFullYear(),histMonth.getMonth()-1,1);selDay=null;render()}

  else if(b.dataset.rp){rp=b.dataset.rp;render()}
  else if(b.id==="rpPrev"||b.id==="rpNext"){const d=new Date(rAnchor||new Date()),s=b.id==="rpPrev"?-1:1;
    if(rp==="day")d.setDate(d.getDate()+s);else if(rp==="week")d.setDate(d.getDate()+7*s);else if(rp==="month"){d.setDate(1);d.setMonth(d.getMonth()+s)}else d.setFullYear(d.getFullYear()+s);
    rAnchor=d;render()}
  else if(b.id==="rpToday"){rAnchor=new Date();render()}
  else if(b.id==="docOpen"){openDoctor()}
  else if(b.dataset.delc){S.settings.custom.splice(+b.dataset.delc,1);saveSettings();render()}

  else if(b.id==="bkShare"){try{Android.shareBackup(backupJSON(),backupName())}catch(err){toast("Paylaşılamadı")}}
  else if(b.id==="bkCopy"){const t=backupJSON();$("#bkText").value=t;
    let ok=false;try{if(window.Android&&Android.copy){Android.copy(t);ok=true}}catch(e){}
    if(ok)toast("Yedek kopyalandı");else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Yedek kopyalandı"),()=>{$("#bkText").select();toast("Metni seçip kopyala")});else{$("#bkText").select();toast("Metni seçip kopyala")}}
  else if(b.id==="bkLoad"){confirmRestore($("#bkText").value)}
  else if(b.id==="saveSet"){const st=S.settings;
    st.kcal=Math.max(800,Math.min(5000,+$("#sKcal").value||1800));st.pPct=+$("#sP").value||0;st.fPct=+$("#sF").value||0;st.cPct=+$("#sC").value||0;

function pushReminder(){if(!S.settings.welcomed)return;
  // İlaç kullanmıyorsa ilaç bildirimi kapatılır (eski APK'larda setMedReminder yok, bildirim sürer)
  try{if(window.Android){if(Android.setMedReminder)Android.setMedReminder(S.settings.medTime||"",medLabel(),!noMed());else if(Android.setReminder&&!noMed())Android.setReminder(S.settings.medTime||"",medLabel())}}catch(e){}
  try{if(window.Android&&Android.setWeightReminder)Android.setWeightReminder(S.settings.weightTime||"",!!S.settings.weightOn&&!!S.settings.weightTime)}catch(e){}
  try{if(window.Android&&Android.setSupplements)Android.setSupplements(JSON.stringify(suppsL().filter(x=>x.on).map(x=>({id:x.id,name:x.name,time:x.time}))))}catch(e){}}
function syncNative(){try{if(!window.Android||!Android.takenFromNotification)return;const v=Android.takenFromNotification();
  if(v){const[dk,at]=v.split("|");if(dk&&at){day(dk).med={at};saveDay(dk);render()}}}catch(e){}
  try{if(window.Android&&Android.suppTaken){const a=JSON.parse(Android.suppTaken()||"[]");a.forEach(x=>{const[dk,id,at]=String(x).split("|");if(dk&&id&&at){const d=day(dk);(d.sup||(d.sup={}))[id]=at;saveDay(dk)}});if(a.length)render()}}catch(e){}
  try{if(window.Android&&Android.openTarget&&Android.openTarget()==="weight"){vDay=todayKey();document.querySelectorAll(".scrim").forEach(x=>x.remove());tab="today";render();window.scrollTo(0,0);setTimeout(()=>{const i=$("#wIn");if(i)i.focus()},150)}}catch(e){}}

render();
const hasData=()=>Object.values(S.days).some(d=>d&&((d.entries&&d.entries.length)||d.med||d.w));
if(!S.settings.welcomed){if(hasData()){S.settings.welcomed=true;saveSettings();pushReminder()}else showOnboarding()}
